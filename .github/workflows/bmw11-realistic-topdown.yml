name: BMW11 Realistic TopDown Build

on:
  push:
    branches: [ "feature/bmw11-realistic-topdown" ]
  workflow_dispatch:

concurrency:
  group: bmw11-realistic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Gruenderelf-v0.5.23-bmw11-realistic-topdown
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
