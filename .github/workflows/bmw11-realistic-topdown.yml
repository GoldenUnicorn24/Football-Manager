name: BMW16 Territory Sync Build

on:
  push:
    branches: [ "feature/bmw15-player-autonomy" ]
  workflow_dispatch:

concurrency:
  group: bmw16-territory-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Spatial and territory tests
        run: ./gradlew --no-daemon :engine:test --tests de.gruenderelf.engine.MatchSpatialModelTest --tests de.gruenderelf.engine.MatchTerritoryPhaseTest --stacktrace
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Gruenderelf-v0.5.23-bmw16-territory-sync
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
