name: Export Android signing tools
on:
  push:
    branches: [ "tools/apksigner-export" ]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Android signing tools
        run: |
          set -eux
          BT="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$BT/apksigner"
          test -x "$BT/zipalign"
          test -f "$BT/lib/apksigner.jar"
          mkdir -p signer/lib
          cp "$BT/apksigner" signer/
          cp "$BT/zipalign" signer/
          cp "$BT/lib/apksigner.jar" signer/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-signing
          path: signer
          if-no-files-found: error
