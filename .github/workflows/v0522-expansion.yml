name: Gründerelf v0.5.22 Expansion CI
on:
  push:
    branches: [ "feat/v0.5.22-expansion" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Engine tests
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon -PgruenderelfKeystorePassword=ci-placeholder :engine:test \
            --tests 'de.gruenderelf.engine.EngineTest.realModeCanStartInEveryPackedLeagueAndUsesDynamicLeagueLength' \
            --tests 'de.gruenderelf.engine.EngineTest.modernUefaAdvancesThroughPlayoffsTwoLeggedRoundsAndFinal' \
            --tests 'de.gruenderelf.engine.EngineTest.realModeUefaUsesModernLeaguePhaseAndDfbHas64GermanClubs' \
            --tests 'de.gruenderelf.engine.EngineTest.realModeContainsOriginalGamePlusExpandedLeaguesAndCompetitions' \
            --tests 'de.gruenderelf.engine.EngineTest.realModeDatasetHasExpandedLeagueAndSquadShape' \
            --tests 'de.gruenderelf.engine.EngineTest.oberligaTakeoverAndCustomClubStartArePlayable' \
            --tests 'de.gruenderelf.engine.RealismV05Test.modernUefaDrawUsesPotsAndAssociationLimits' \
            --tests 'de.gruenderelf.engine.V0514EconomyPotentialTest.leagueCupAndChampionsLeagueTitlesPayExtraPrizeMoneyExactlyOnce' \
            --stacktrace
          code=$?
          if [ $code -ne 0 ]; then grep -R -n -A8 -B2 '<failure' engine/build/test-results/test/*.xml || true; fi
          exit $code
