name: Gründerelf v0.5.22 Expansion CI
on:
  push:
    branches: [ "feat/v0.5.22-expansion" ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v0522-expansion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Gradle
        run: chmod +x gradlew
      - name: Engine tests
        run: ./gradlew --no-daemon :engine:test --stacktrace
      - name: App unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug --stacktrace
      - name: Build installable debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Gruenderelf-v0.5.22-HCTR-expansion-installable
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build unsigned release APK
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Gruenderelf-v0.5.22-HCTR-expansion-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
