name: Gruenderelf Match Overview Build

on:
  push:
    branches: [ "feature/match-overview-toggle" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create temporary CI signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore app/gruenderelf-update.jks \
            -storepass ci-match-view-2026 \
            -keypass ci-match-view-2026 \
            -alias gruenderelf \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Match View CI, OU=CI, O=Gruenderelf, L=Hamburg, ST=Hamburg, C=DE"
          echo "GRUENDERELF_KEYSTORE_PASSWORD=ci-match-view-2026" >> "$GITHUB_ENV"

      - name: Compile and build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Gruenderelf-Match-Overview-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
