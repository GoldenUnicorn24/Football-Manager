name: AI Dev Agent APK

on:
  push:
    branches:
      - ai-dev-agent-v0.1
    paths:
      - 'ai-dev-agent/**'
      - '.github/workflows/ai-dev-agent-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p ai-dev-agent :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-dev-agent-v0.1-debug
          path: ai-dev-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
