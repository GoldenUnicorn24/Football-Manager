name: BMW Developer Fast Check

concurrency:
  group: bmw-fast-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/bmw-fc-developer-mode-v0523

jobs:
  compile-and-targeted-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile engine and app
        run: ./gradlew :engine:compileKotlin :app:compileDebugKotlin --stacktrace
      - name: BMW developer tests
        run: ./gradlew :engine:test --tests de.gruenderelf.engine.BmwDeveloperModeTest --stacktrace
