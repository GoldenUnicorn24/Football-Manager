name: Bootstrap exact HCTR v0.5.18 source

on:
  push:
    branches: [ "bootstrap/hctr-v0.5.18-reset" ]
    paths:
      - ".github/workflows/bootstrap-hctr-v0518.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact HCTR source
        shell: bash
        run: |
          set -euxo pipefail
          cat .bootstrap/hctr-v0518/patch*.b64 | tr -d '\n\r ' | base64 --decode > /tmp/hctr.patch.gz
          echo "49a2aa641b526360ef53c7e041f2a6512f063cd1b97c747fd10a1442b6974184  /tmp/hctr.patch.gz" | sha256sum -c -
          gzip -t /tmp/hctr.patch.gz
          gzip -dc /tmp/hctr.patch.gz > /tmp/hctr.patch
          patch -p1 --batch < /tmp/hctr.patch
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-hctr-v0518.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          grep -q 'versionCode=49; versionName="0.5.18"' app/build.gradle.kts
          grep -q 'const val SAVE_VERSION = 8' engine/src/main/kotlin/de/gruenderelf/engine/Model.kt
          grep -q 'const val CHANGELOG_VERSION="0.5.18"' app/src/main/kotlin/de/gruenderelf/app/ui/ChangelogUi.kt
          grep -q 'MANAGER-HANDBUCH · v0.5.18' app/src/main/kotlin/de/gruenderelf/app/ui/ManagementScreens.kt

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify original HCTR source builds and tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :engine:test :app:assembleDebug --stacktrace

      - name: Commit exact HCTR v0.5.18 baseline
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "Gruenderelf Restore"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Restore exact HCTR v0.5.18 source baseline"
          git push origin HEAD:bootstrap/hctr-v0.5.18-reset
