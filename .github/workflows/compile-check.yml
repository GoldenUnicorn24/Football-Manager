name: Schnellcheck Kompilieren

# Kompiliert Engine, Tests und App und führt alle Engine-Testklassen parallel aus – schnelle Rückmeldung bei Feature-Branches.
on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK vorbereiten
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Kompilieren
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --continue :engine:compileTestKotlin :app:compileDebugKotlin 2>&1 | tee compile.log
      - name: Fehler melden
        if: failure()
        run: |
          grep -hE "^e: |What went wrong" compile.log 2>/dev/null | head -60 | sed 's/^/::error::/' || true

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - "AdvancedSystemsTest"
          - "BmwDeveloperModeTest"
          - "BmwGoalkeeperDiagnosticsTest"
          - "BrandingPersistenceTest"
          - "CareerExpansionTest"
          - "ClubLifeV0527Test"
          - "DecisionSafetyV0511Test"
          - "EngineTest"
          - "ManagerSystemsV0469Test"
          - "MatchAiTest"
          - "MatchSpatialModelTest"
          - "MatchTerritoryPhaseTest"
          - "MonteCarloV0455Test"
          - "OutboundYouthV0512Test"
          - "RealismV05Test"
          - "ShotModelTest"
          - "TrainingEngineTest"
          - "UnifiedLiveRuntimeTest"
          - "V0514EconomyPotentialTest"
          - "V0515YouthPotentialTest"
          - "V0516NotificationTest"
          - "V0517TransferFlowTest"
          - "YouthSquadsV0513Test"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: ${{ matrix.suite }}
        run: |
          chmod +x gradlew
          sed -i 's/include(":app", ":engine")/include(":engine")/' settings.gradle.kts
          set -o pipefail
          ./gradlew --no-daemon :engine:test --tests "de.gruenderelf.engine.${{ matrix.suite }}" 2>&1 | tee test.log
      - name: Fehler melden
        if: failure()
        run: |
          grep -hE "^e: |What went wrong| FAILED$|AssertionError|Exception" test.log 2>/dev/null | head -30 | sed 's/^/::error title=${{ matrix.suite }}::/' || true
