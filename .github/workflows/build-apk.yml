name: APK bauen

# Testet die Spiel-Engine und baut bei jedem Push eine signierte Release-APK.
# Download: Reiter „Releases“ → „Gründerelf · <Branch>“ → Assets.
#
# Einmalig in GitHub hinterlegen (Settings → Secrets and variables → Actions):
#   GRUENDERELF_KEYSTORE_BASE64    – Inhalt von gruenderelf-update.jks.base64.txt
#   GRUENDERELF_KEYSTORE_PASSWORD  – das Keystore-Passwort
#   GRUENDERELF_DEV_CODE           – Developer-Code für den BMW-FC-Modus (in der App landet nur ein Hash)
# Ohne Keystore-Secrets wird mit einem Ersatzschlüssel signiert (dann nur Neuinstallation möglich).

on:
  push:
    branches: [main, "redesign/**", "feature/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Keystore bereitstellen
        id: ks
        env:
          KS: ${{ secrets.GRUENDERELF_KEYSTORE_BASE64 }}
          PW: ${{ secrets.GRUENDERELF_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "$KS" | tr -d ' \r\n' | base64 -d > app/gruenderelf-update.jks
            echo "GRUENDERELF_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Keine Keystore-Secrets hinterlegt – APK wird mit Ersatzschlüssel signiert und lässt sich NICHT als Update installieren."
            PW=gruenderelf-ci-fallback
            keytool -genkeypair -keystore app/gruenderelf-update.jks -alias gruenderelf -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Gruenderelf CI" -noprompt
            echo "GRUENDERELF_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "suffix=-NEUINSTALLATION" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK vorbereiten
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine-Tests
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :engine:test --continue 2>&1 | tee gradle-test.log

      - name: Fehlgeschlagene Tests melden
        if: failure()
        run: |
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          n=0
          for f in glob.glob("engine/build/test-results/test/*.xml"):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fail in list(tc.findall("failure"))+list(tc.findall("error")):
                      n+=1
                      msg=(fail.get("message") or fail.text or "").strip().replace("\n"," ")[:300]
                      print(f"::error title=Test {tc.get('classname','').split('.')[-1]}.{tc.get('name')}::{msg}")
          if n==0: print("::error::Keine fehlgeschlagenen Testfälle gefunden – siehe Gradle-Meldungen.")
          PY
          grep -E "^e: |What went wrong|> Task .*FAILED" gradle-test.log | head -40 | sed 's/^/::error::/' || true

      - name: Release-APK bauen
        env:
          GRUENDERELF_DEV_CODE: ${{ secrets.GRUENDERELF_DEV_CODE }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Build-Fehler melden
        if: failure()
        run: grep -E "^e: |What went wrong|ERROR:|Missing class|> Task .*FAILED" gradle-build.log 2>/dev/null | head -50 | sed 's/^/::error::/' || true

      - name: APK benennen
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName="\K[^"]+' app/build.gradle.kts)
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          NAME="Gruenderelf-${VERSION}-build${GITHUB_RUN_NUMBER}${{ steps.ks.outputs.suffix }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Als Release zum Download bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.apk.outputs.branch }}
          name: Gründerelf · ${{ github.ref_name }}
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          body: |
            Automatisch gebaut aus `${{ github.ref_name }}` (Commit ${{ github.sha }}), Version ${{ steps.apk.outputs.version }}. Engine-Tests: bestanden.
            APK unten unter „Assets“ herunterladen und auf dem Handy öffnen.
            Dateien mit „NEUINSTALLATION“ im Namen sind mit einem Ersatzschlüssel signiert: alte App vorher deinstallieren und Spielstände vorher exportieren.
          files: ${{ steps.apk.outputs.name }}

      - name: Keystore entfernen
        if: always()
        run: rm -f app/gruenderelf-update.jks
