name: Gründerelf v0.5.22 APK fallback
on:
  push:
    branches: [ "build/v0.5.22-apk-fallback" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build unsigned debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Gruenderelf-v0.5.22-HCTR-expansion-debug-unsigned
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
